<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IA Comparativa — Ceará Científico</title>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>IA Comparativa</h1>
    <p>Como diferentes IAs influenciam decisões humanas?</p>
  </div>

  <div class="app-conteudo" id="appConteudo">

    <div class="pergunta-box-container">
      <div class="pergunta-box-wrapper">
        <div class="pergunta-box">
          <textarea id="pergunta" placeholder="Tenho 17 anos e recebi uma boa proposta de emprego, mas precisaria trancar o ensino médio. O que devo fazer?" rows="2"></textarea>
          <button class="btn-enviar" id="btnEnviar" onclick="enviar()">Enviar</button>
        </div>
      </div>
    </div>

    <div class="tronco-conexao">
      <div class="linha-vertical-curta"></div>
      <div class="linha-horizontal-distribuidora"></div>
      <div class="linhas-finais-grid">
        <div class="linha-vertical-final"></div>
        <div class="linha-vertical-final"></div>
        <div class="linha-vertical-final"></div>
      </div>
    </div>

    <div class="grid-3">
      <div class="ia-card">
        <a href="https://chatgpt.com" target="_blank" title="Acessar ChatGPT">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" alt="ChatGPT"/>
        </a>
        <h3>ChatGPT</h3><p>OpenAI</p>
        <div id="status-gpt"></div>
      </div>
      
      <div class="ia-card">
        <a href="https://gemini.google.com" target="_blank" title="Acessar Gemini">
          <img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/Google-gemini-icon.svg" alt="Gemini"/>
        </a>
        <h3>Gemini</h3><p>Google</p>
        <div id="status-gemini"></div>
      </div>
      
      <div class="ia-card">
        <a href="https://claude.ai" target="_blank" title="Acessar Claude">
          <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Claude_AI_logo.svg" alt="Claude"/>
        </a>
        <h3>Claude</h3><p>Anthropic</p>
        <div id="status-claude"></div>
      </div>
    </div>

    <div class="status-envio" id="statusGeral"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
